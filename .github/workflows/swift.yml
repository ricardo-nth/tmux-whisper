name: Swift

on:
  push:
    branches:
      - main
    paths:
      - "tmux-whisperd/**"
      - ".github/workflows/swift.yml"
      # Lowkey's TextPipeline must match the CLI cleanup byte for byte.
      - "bin/dictate-lib.sh"
      - "bin/tmux-whisper"
      - "bin/tmux-whisper-lib/**"
      - "config/**"
      - "tests/fixtures/cleanup/**"
      - "tests/gen-cleanup-fixtures.sh"
      - "tests/gen_cleanup_fixtures.py"
  pull_request:
    paths:
      - "tmux-whisperd/**"
      - ".github/workflows/swift.yml"
      # Lowkey's TextPipeline must match the CLI cleanup byte for byte.
      - "bin/dictate-lib.sh"
      - "bin/tmux-whisper"
      - "bin/tmux-whisper-lib/**"
      - "config/**"
      - "tests/fixtures/cleanup/**"
      - "tests/gen-cleanup-fixtures.sh"
      - "tests/gen_cleanup_fixtures.py"

jobs:
  tmux-whisper-kit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tmux-whisperd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: tmux-whisperd/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('tmux-whisperd/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Toolchain
        run: swift --version

      - name: Cleanup fixtures match the CLI
        # Regenerates the expected outputs from the bash cleanup; fails if the
        # committed tests/fixtures/cleanup/expected.json is stale.
        run: ../tests/gen-cleanup-fixtures.sh --check

      - name: Test TmuxWhisperKit and LowkeyCore
        run: swift test

      - name: Build release daemon
        run: swift build -c release --product tmux-whisperd && .build/release/tmux-whisperd version

      - name: Build Lowkey app binary
        run: swift build -c release --product Lowkey
