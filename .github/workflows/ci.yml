name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run CI checks
        run: ./tests/ci.sh

  native-companion:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test native companion
        run: swift run --package-path integrations/native-macos CompanionCoreRegression
      - name: Build local app bundle
        run: ./integrations/native-macos/build.sh
